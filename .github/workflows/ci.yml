# Runs the same suite as `pnpm test`: the Rust verifier's tests, then the circuits, service and mcp
# vitest suites. The live tests read public Zcash testnet through testnet.zec.rocks with the published
# viewing keys, so no secrets are needed. Expect about 6-7 minutes (network-bound live audits).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # rustup reads packages/verifier/rust-toolchain.toml (1.89.0) on first use.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/verifier/target
          key: cargo-${{ runner.os }}-${{ hashFiles('packages/verifier/Cargo.lock', 'packages/verifier/rust-toolchain.toml') }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
